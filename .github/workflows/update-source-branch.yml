          index d368ec3..b8c2a4e 100644
          --- a/src/voxpilot/overlay/overlay_service.py
          +++ b/src/voxpilot/overlay/overlay_service.py
          @@ -579,3 +579,77 @@ class OverlayService(IOverlayService):
                       self._canvas.update()
                       if self._app:
                           self._app.processEvents()
          +
          +
          +# -----------------------------------------------------------------------------
          +# GUI-thread marshalling: Qt widgets may only be touched from the thread that owns
          +# them. Speech/command handling runs on worker threads, so every mutating overlay
          +# call made from another thread is queued to the GUI thread and waited for.
          +# -----------------------------------------------------------------------------
          +class _GuiInvoker(QtCore.QObject):
          +    call = QtCore.Signal(object)
          +
          +    def __init__(self) -> None:
          +        super().__init__()
          +        self.call.connect(self._run, QtCore.Qt.QueuedConnection)
          +
          +    @QtCore.Slot(object)
          +    def _run(self, job) -> None:
          +        job()
          +
          +
          +def _marshal(fn):
          +    import functools
          +
          +    @functools.wraps(fn)
          +    def wrapper(self, *args, **kwargs):
          +        invoker = getattr(self, "_invoker", None)
          +        if invoker is None or threading.get_ident() == self._gui_ident:
          +            return fn(self, *args, **kwargs)
          +        state = {"claimed": False, "done": threading.Event(), "result": None, "error": None}
          +        lock = threading.Lock()
          +
          +        def job():
          +            with lock:
          +                if state["claimed"]:
          +                    return
          +                state["claimed"] = True
          +            try:
          +                state["result"] = fn(self, *args, **kwargs)
          +            except BaseException as exc:  # pragma: no cover
          +                state["error"] = exc
          +            finally:
          +                state["done"].set()
          +
          +        invoker.call.emit(job)
          +        if not state["done"].wait(1.0):
          +            with lock:
          +                if not state["claimed"]:
          +                    # no GUI event loop is running (headless/tests): run inline as before
          +                    state["claimed"] = True
          +                    return fn(self, *args, **kwargs)
          +            state["done"].wait(5.0)
          +        if state["error"] is not None:
          +            raise state["error"]
          +        return state["result"]
          +
          +    return wrapper
          +
          +
          +_orig_init_qt = OverlayService._init_qt
          +
          +
          +def _init_qt_with_invoker(self) -> None:
          +    _orig_init_qt(self)
          +    self._gui_ident = threading.get_ident()
          +    self._invoker = _GuiInvoker()
          +
          +
          +OverlayService._init_qt = _init_qt_with_invoker
          +for _name in (
          +    "show_numbers", "show_names", "hide_names", "show_grid", "show_text_numbers",
          +    "hide_text_numbers", "show_disambiguation", "show_hud", "hide", "hide_numbers",
          +    "hide_grid", "hide_all", "update_hud", "drill_down_grid", "undo_grid",
          +):
          +    if hasattr(OverlayService, _name):
          +        setattr(OverlayService, _name, _marshal(getattr(OverlayService, _name)))
          diff --git a/tests/test_voice_control_parity.py b/tests/test_voice_control_parity.py
          index 4c64eb6..3f9ced4 100644
          --- a/tests/test_voice_control_parity.py
          +++ b/tests/test_voice_control_parity.py
          @@ -201,3 +201,25 @@ def test_final_transcripts_are_handled_off_the_audio_thread(engine) -> None:
                   time.sleep(0.05)
               assert seen and seen[0][1] == "voxpilot-dispatch"
               e.stop()
          +
          +
          +def test_overlay_calls_from_worker_thread_run_on_gui_thread() -> None:
          +    """Overlay mutations made off the GUI thread are queued to it (Qt widgets are not thread-safe)."""
          +    import threading
          +    from PySide6 import QtCore, QtWidgets
          +    from voxpilot.overlay.overlay_service import OverlayService
          +    ov = OverlayService()
          +    gui = threading.get_ident()
          +    ran = []
          +    orig = ov._canvas.hide
          +    ov._canvas.hide = lambda: (ran.append(threading.get_ident()), orig())[1]
          +    t = threading.Thread(target=ov.hide_all)
          +    t.start()
          +    app = QtWidgets.QApplication.instance()
          +    import time
          +    t0 = time.time()
          +    while t.is_alive() and time.time() - t0 < 3:
          +        app.processEvents()
          +        time.sleep(0.01)
          +    t.join()
          +    assert ran == [gui]
          PATCH_EOF
          git apply --whitespace=nowarn vehicle/fix5.patch
      - name: Setup and test
        shell: cmd
        run: setup_windows.bat
      - name: Tests
        shell: cmd
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q tests --tb=short
      - name: Commit and push source branch (only if tests passed)
        shell: pwsh
        run: |
          git config user.name "voxpilot-parity-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A -- . ':!vehicle' ':!.venv' ':!models'
          git commit -m "GUI-thread overlay marshalling; Apple-style tray menu"
          git push origin voxpilot-voice-control-parity
