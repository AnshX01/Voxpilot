          -        lay.addWidget(btn)
          -        ctx = "text" if engine.mode.value in ("dictation", "spelling", "swift") else "general"
          +        if rows is None:
          +            ctx = "general"
          +            if engine is not None and engine.mode.value in ("dictation", "spelling", "swift"):
          +                ctx = "text"
          +            rows = commands_for_context(ctx)
                   cats = {}
          -        for cat, phrase, desc in commands_for_context(ctx):
          +        for cat, phrase, desc in rows:
                       top = cats.get(cat)
                       if top is None:
                           top = QtWidgets.QTreeWidgetItem([cat])
          +                f = top.font(0)
          +                f.setBold(True)
          +                top.setFont(0, f)
          +                top.setForeground(0, QtGui.QBrush(QtGui.QColor(110, 106, 102)))
                           self.tree.addTopLevelItem(top)
                           cats[cat] = top
          -            top.addChild(QtWidgets.QTreeWidgetItem([phrase, desc]))
          -        self.tree.expandAll()
          -        self.tree.setWordWrap(True)
          +            child = QtWidgets.QTreeWidgetItem([phrase])
          +            child.setToolTip(0, desc)
          +            top.addChild(child)
          +        self.tree.expandItem(self.tree.topLevelItem(0))
                   self.tree.setTextElideMode(QtCore.Qt.ElideNone)
          -        self.tree.header().setStretchLastSection(True)
          -        self.tree.resizeColumnToContents(0)
          -        self.tree.setColumnWidth(0, max(self.tree.columnWidth(0), 330))


           class Tutorial(QtWidgets.QDialog):
          diff --git a/src/voxpilot/app/tray.py b/src/voxpilot/app/tray.py
          index b7fe2d5..f49e0f4 100644
          --- a/src/voxpilot/app/tray.py
          +++ b/src/voxpilot/app/tray.py
          @@ -295,8 +295,10 @@ class VoxPilotTrayIcon(QtWidgets.QSystemTrayIcon):

               def _open_commands_window(self) -> None:
                   from .commands_window import CommandsWindow
          -        self._cmd_window = CommandsWindow(self.engine)
          -        self._cmd_window.show()
          +        shower = getattr(self.engine.overlay_service, "show_commands_window", None)
          +        if shower:
          +            from .command_catalog import commands_for_context
          +            shower(commands_for_context("general"))

               def _toggle_listening(self) -> None:
                   if self.engine.mode == EngineMode.SLEEP:
          diff --git a/src/voxpilot/engine.py b/src/voxpilot/engine.py
          index 150871c..bebaab9 100644
          --- a/src/voxpilot/engine.py
