# run 5
name: update-source-branch
on:
  push:
    branches: [voxpilot-parity-windows-test]
    paths: [".github/workflows/update-source-branch.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-voice-control-parity
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-parity-windows-test
          path: vehicle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply update patch
        shell: pwsh
        run: git apply --whitespace=nowarn vehicle/2-fix2.patch
      - name: Apply fix3 (inline patch)
        shell: bash
        run: |
          cat > vehicle/fix3.patch <<'PATCH_EOF'
          From 1c97386dee13ef3b1b13bc05be2b9db2d324278f Mon Sep 17 00:00:00 2001
          From: audit <a@b.c>
          Date: Tue, 13 Oct 2026 19:33:26 +0530
          Subject: [PATCH] Stop numbers refresh timer before teardown; guard re-entrancy
           (fixes Windows access violation in stop)

          ---
           src/voxpilot/engine.py                  |  8 ++++++++
           src/voxpilot/overlay/overlay_service.py | 10 ++++++++++
           tests/test_voice_control_parity.py      |  1 +
           3 files changed, 19 insertions(+)

          diff --git a/src/voxpilot/engine.py b/src/voxpilot/engine.py
          index 94a7fb2..60678ae 100644
          --- a/src/voxpilot/engine.py
          +++ b/src/voxpilot/engine.py
          @@ -103,6 +103,9 @@ class VoxPilotEngine:

               def _refresh_numbers(self) -> None:
                   """Keep on-screen numbers in step with the screen while they are shown (GUI-thread timer)."""
          +        if getattr(self, "_refreshing", False) or not self.is_running:
          +            return
          +        self._refreshing = True
                   try:
                       ov = self.overlay_service
                       if not ov.is_numbers_visible() or self.mode == EngineMode.SLEEP:
          @@ -115,6 +118,8 @@ class VoxPilotEngine:
                           ov.show_numbers(elements, continuous=ov.is_continuous_numbers())
                   except Exception:  # pragma: no cover
                       logger.exception("numbers refresh failed")
          +        finally:
          +            self._refreshing = False

               def stop_live_capture(self) -> None:
                   if self._live_capture:
          @@ -125,6 +130,9 @@ class VoxPilotEngine:
                   self.is_running = False
                   self.stop_live_capture()
                   self.speech_engine.stop()
          +        stopper = getattr(self.overlay_service, "stop_refresh", None)
          +        if callable(stopper):
          +            stopper()
                   self.overlay_service.hide_all()
                   self.input_injector.release_all_modifiers()

          diff --git a/src/voxpilot/overlay/overlay_service.py b/src/voxpilot/overlay/overlay_service.py
          index c74f36b..d368ec3 100644
          --- a/src/voxpilot/overlay/overlay_service.py
          +++ b/src/voxpilot/overlay/overlay_service.py
          @@ -528,6 +528,16 @@ class OverlayService(IOverlayService):
                   timer.timeout.connect(callback)
                   timer.start(interval_ms)

          +    def stop_refresh(self) -> None:
          +        """Stop the periodic refresh timer (before teardown, so no callback runs mid-hide)."""
          +        timer = getattr(self, "_refresh_timer", None)
          +        if timer is not None:
          +            try:
          +                timer.stop()
          +                timer.timeout.disconnect()
          +            except Exception:
          +                pass
          +
               def hide_numbers(self) -> None:
                   self._is_continuous_numbers = False
                   if self._current_mode in (OverlayMode.NUMBERS, OverlayMode.CONTINUOUS_NUMBERS):
          diff --git a/tests/test_voice_control_parity.py b/tests/test_voice_control_parity.py
          index fca9ee4..68cc4e1 100644
          --- a/tests/test_voice_control_parity.py
          +++ b/tests/test_voice_control_parity.py
          @@ -156,6 +156,7 @@ def test_tray_microphone_choice_restarts_capture(monkeypatch) -> None:
           def test_numbers_refresh_follows_the_screen(engine) -> None:
               """Numbers must update when the screen changes, not stay a one-shot snapshot."""
               e, _, _ = engine
          +    e.is_running = True
               from voxpilot.contracts.dto import LabeledElement, ScreenRect

               def el(i, x):
          -- 
          2.34.1
          PATCH_EOF
          git apply --whitespace=nowarn vehicle/fix3.patch
      - name: Setup and test
        shell: cmd
        run: setup_windows.bat
      - name: Tests
        shell: cmd
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q tests --tb=short
      - name: Commit and push source branch (only if tests passed)
        shell: pwsh
        run: |
          git config user.name "voxpilot-parity-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A -- . ':!vehicle' ':!.venv' ':!models'
          git commit -m "Fix live listening and numbers lifecycle"
          git push origin voxpilot-voice-control-parity
