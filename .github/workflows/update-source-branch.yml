# run 13
name: update-source-branch
on:
  push:
    branches: [voxpilot-parity-windows-test]
    paths: [".github/workflows/update-source-branch.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-voice-control-parity
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-parity-windows-test
          path: vehicle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fix13 (inline patch)
        shell: bash
        run: |
          cat > vehicle/fix13.patch <<'PATCH_EOF'
          diff --git a/src/voxpilot/app/command_catalog.py b/src/voxpilot/app/command_catalog.py
          index a3cc292..cc4ad34 100644
          --- a/src/voxpilot/app/command_catalog.py
          +++ b/src/voxpilot/app/command_catalog.py
          @@ -17,6 +17,11 @@ CATALOG: Dict[str, List[Tuple[str, str]]] = {
                   ("Stop listening / Start listening", "Pause or resume Voice Control"),
                   ("Show commands", "List available commands"),
                   ("Open Voice Control Tutorial", "Practise essential commands"),
          +        ("Open document / Save document / New item", "Ctrl+O / Ctrl+S / Ctrl+N"),
          +        ("Next app / Previous app", "Alt+Tab / Alt+Shift+Tab"),
          +        ("Quit application / Hide application", "Alt+F4 / minimise"),
          +        ("Show keyboard / Hide keyboard", "Windows on-screen keyboard"),
          +        ("Repeat <n> times", "Repeat the previous command"),
               ],
               "Overlays": [
                   ("Show names / Hide names", "Label items with their names"),
          @@ -42,7 +47,24 @@ CATALOG: Dict[str, List[Tuple[str, str]]] = {
           }


          +def character_rows() -> List[Tuple[str, str]]:
          +    """What to say for each character in Dictation / Spelling mode (guide: Commands > Dictation mode)."""
          +    from voxpilot.dictation.formatting import NATO_PHONETIC, PUNCTUATION_PHRASES
          +    rows: List[Tuple[str, str]] = []
          +    seen = set()
          +    for phrase, ch in PUNCTUATION_PHRASES:
          +        if phrase not in seen:
          +            seen.add(phrase)
          +            shown = {"\n": "new line", "\n\n": "new paragraph"}.get(ch, ch)
          +            rows.append((f"{phrase}  =  {shown}", "Say this to enter the character"))
          +    for word, ch in sorted(NATO_PHONETIC.items()):
          +        rows.append((f"{word}  =  {ch}", "Spelling mode code word"))
          +    return rows
          +
          +
           def commands_for_context(ctx: str) -> List[Tuple[str, str, str]]:
               """Return (category, phrase, description) rows; text-editing first when typing."""
               order = ["Text editing", "Modes", "Overlays", "Basic Navigation"] if ctx == "text" else list(CATALOG)
          -    return [(cat, phrase, desc) for cat in order for phrase, desc in CATALOG[cat]]
          +    rows = [(cat, phrase, desc) for cat in order for phrase, desc in CATALOG[cat]]
          +    rows += [("Dictation and Spelling characters", p, d) for p, d in character_rows()]
          +    return rows
          diff --git a/src/voxpilot/commands/command_parser.py b/src/voxpilot/commands/command_parser.py
          index 1b16726..439549d 100644
          --- a/src/voxpilot/commands/command_parser.py
          +++ b/src/voxpilot/commands/command_parser.py
          @@ -36,6 +36,15 @@ class CommandParser:
                       {"intent": "HIDE_NAMES", "patterns": [r"^(?:please\s+)?hide\s+(?:item\s+)?names$", r"^names\s+off$"]},
                       {"intent": "SHOW_GRID", "patterns": [r"^(?:show|show me)?\s*(?:the\s+)?(?:screen\s+)?grid$", r"^grid\s+on$"]},
                       {"intent": "HIDE_GRID", "patterns": [r"^(?:please\s+)?hide\s+grid$", r"^grid\s+off$", r"^cancel\s+grid$"]},
          +            {"intent": "OPEN_DOCUMENT", "patterns": [r"^open\s+document$"]},
          +            {"intent": "SAVE_DOCUMENT", "patterns": [r"^save\s+document$"]},
          +            {"intent": "NEW_ITEM", "patterns": [r"^new\s+item$"]},
          +            {"intent": "NEXT_APP", "patterns": [r"^next\s+app(?:lication)?$"]},
          +            {"intent": "PREVIOUS_APP", "patterns": [r"^previous\s+app(?:lication)?$"]},
          +            {"intent": "QUIT_APP", "patterns": [r"^quit\s+application$"]},
          +            {"intent": "HIDE_APP", "patterns": [r"^hide\s+application$"]},
          +            {"intent": "SHOW_KEYBOARD", "patterns": [r"^show\s+keyboard$"]},
          +            {"intent": "HIDE_KEYBOARD", "patterns": [r"^hide\s+keyboard$"]},
                       {"intent": "OPEN_TUTORIAL", "patterns": [r"^open\s+(the\s+)?voice\s+control\s+tutorial$"]},
                       {"intent": "SHOW_COMMANDS", "patterns": [r"^show\s+commands$", r"^what\s+can\s+i\s+say$"]},
                       {"intent": "WAKE_UP", "patterns": [r"^(?:voxpilot\s+)?wake\s+up(?:\s+voxpilot)?$", r"^start\s+listening$"]},
          @@ -119,6 +128,12 @@ class CommandParser:
                           raw_text=text,
                       )

          +        m_rep = re.match(r"^repeat\s+([a-z0-9]+)\s+times?$", cleaned)
          +        if m_rep:
          +            cnt = self.normalize_number(m_rep.group(1).strip())
          +            if cnt:
          +                return Intent(name="REPEAT_COMMAND", confidence=0.95, slots={"count": cnt}, raw_text=text)
          +
                   # Check key repeat e.g. "press down 5 times", "press tab 3 times"
                   m_repeat = re.match(r"^(?:press|hit)\s+([a-z0-9]+)\s+([a-z0-9]+)\s+times?$", cleaned)
                   if m_repeat:
          diff --git a/src/voxpilot/engine.py b/src/voxpilot/engine.py
          index 0e3080f..e3a4c80 100644
          --- a/src/voxpilot/engine.py
          +++ b/src/voxpilot/engine.py
          @@ -454,6 +454,14 @@ class VoxPilotEngine:
                       if show:
                           show(self.visible_commands)
                       return CommandResult.success(intent=intent, message="Displayed voice commands")
          +        elif name in self._SIMPLE_KEYS:
          +            keys, msg = self._SIMPLE_KEYS[name]
          +            self.input_injector.key_combination(list(keys))
          +            return CommandResult.success(intent=intent, message=msg)
          +        elif name in ("SHOW_KEYBOARD", "HIDE_KEYBOARD"):
          +            return self._handle_keyboard(intent, show=(name == "SHOW_KEYBOARD"))
          +        elif name == "REPEAT_COMMAND":
          +            return self._handle_repeat(intent)
                   elif name == "OPEN_TUTORIAL":
                       opener = getattr(self.overlay_service, "show_tutorial", None)
                       if opener:
          @@ -851,6 +859,47 @@ class VoxPilotEngine:
                   self.input_injector.move_cursor_relative(dx, dy)
                   return CommandResult.success(intent=intent, message=f"Moved cursor {direction} by {amount}px")

          +    # Windows equivalents of guide commands (Basic Navigation list); approximations are noted in the docs.
          +    _SIMPLE_KEYS = {
          +        "OPEN_DOCUMENT": (("ctrl", "o"), "Open document"),
          +        "SAVE_DOCUMENT": (("ctrl", "s"), "Saved document"),
          +        "NEW_ITEM": (("ctrl", "n"), "New item"),
          +        "NEXT_APP": (("alt", "tab"), "Next app"),
          +        "PREVIOUS_APP": (("alt", "shift", "tab"), "Previous app"),
          +        "QUIT_APP": (("alt", "f4"), "Quit application"),
          +        "HIDE_APP": (("win", "down"), "Hid application"),
          +    }
          +
          +    def _handle_keyboard(self, intent: Intent, show: bool) -> CommandResult:
          +        """Windows on-screen keyboard (osk.exe) as the counterpart of the Accessibility Keyboard."""
          +        import subprocess
          +        try:
          +            if show:
          +                subprocess.Popen(["osk.exe"])
          +            else:
          +                subprocess.run(["taskkill", "/IM", "osk.exe", "/F"], capture_output=True, timeout=5)
          +        except Exception as exc:
          +            return CommandResult.failure(intent=intent, message=f"Keyboard: {exc}")
          +        return CommandResult.success(intent=intent, message="Keyboard shown" if show else "Keyboard hidden")
          +
          +    def _handle_repeat(self, intent: Intent) -> CommandResult:
          +        """"Repeat <n> times": run the previous command again n times."""
          +        count = max(1, min(int(intent.slots.get("count", 1)), 50))
          +        prev = None
          +        for r in reversed(self._history):
          +            mi = getattr(r, "matched_intent", None)
          +            if mi is not None and mi.name != "REPEAT_COMMAND":
          +                prev = mi
          +                break
          +        if prev is None:
          +            return CommandResult.no_match(raw_text=intent.raw_text, message="Nothing to repeat")
          +        res = None
          +        for _ in range(count):
          +            res = self.dispatch_intent(prev)
          +            if not res.is_success:
          +                break
          +        return res
          +
               def _record_result(self, res: CommandResult) -> None:
                   self._last_result = res
                   for cb in list(getattr(self, "result_listeners", [])):
          diff --git a/tests/test_voice_control_parity.py b/tests/test_voice_control_parity.py
          index 2403b6b..8238e73 100644
          --- a/tests/test_voice_control_parity.py
          +++ b/tests/test_voice_control_parity.py
          @@ -322,3 +322,34 @@ def test_open_voice_control_tutorial_command() -> None:
               intent = CommandParser().parse("open voice control tutorial")
               assert intent.name == "OPEN_TUTORIAL"
               assert CommandParser().parse("open mail").name != "OPEN_TUTORIAL"
          +
          +
          +def test_guide_basic_navigation_windows_equivalents_parse() -> None:
          +    from voxpilot.commands.command_parser import CommandParser
          +    p = CommandParser()
          +    expect = {"open document": "OPEN_DOCUMENT", "save document": "SAVE_DOCUMENT", "new item": "NEW_ITEM",
          +              "next app": "NEXT_APP", "previous app": "PREVIOUS_APP", "quit application": "QUIT_APP",
          +              "hide application": "HIDE_APP", "show keyboard": "SHOW_KEYBOARD",
          +              "hide keyboard": "HIDE_KEYBOARD", "repeat 3 times": "REPEAT_COMMAND"}
          +    for phrase, name in expect.items():
          +        assert p.parse(phrase).name == name, phrase
          +    assert p.parse("open mail").name == "OPEN_APP"
          +
          +
          +def test_repeat_runs_previous_command_n_times(engine) -> None:
          +    e, _, _ = engine
          +    e.is_running = True
          +    keys = []
          +    e.input_injector.key_combination = lambda k: keys.append(tuple(k)) or True
          +    assert e.process_text_command("save document").is_success
          +    assert e.process_text_command("repeat 3 times").is_success
          +    assert keys == [("ctrl", "s")] * 4
          +    assert e.process_text_command("hide application").is_success
          +
          +
          +def test_character_list_in_commands_rows() -> None:
          +    from voxpilot.app.command_catalog import commands_for_context
          +    rows = [r for r in commands_for_context("general") if r[0] == "Dictation and Spelling characters"]
          +    texts = [r[1] for r in rows]
          +    assert any(t.startswith("question mark") and "?" in t for t in texts)
          +    assert any(t.startswith("alpha") and t.endswith("a") for t in texts)
          PATCH_EOF
          git apply --whitespace=nowarn vehicle/fix13.patch
      - name: Setup and test
        shell: cmd
        run: setup_windows.bat
      - name: Tests
        shell: cmd
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q tests --tb=short
      - name: Commit and push source branch (only if tests passed)
        shell: pwsh
        run: |
          git config user.name "voxpilot-parity-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A -- . ':!vehicle' ':!.venv' ':!models'
          git commit -m "Guide navigation equivalents, repeat, character list"
          git push origin voxpilot-voice-control-parity
