# run 12
name: update-source-branch
on:
  push:
    branches: [voxpilot-parity-windows-test]
    paths: [".github/workflows/update-source-branch.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-voice-control-parity
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-parity-windows-test
          path: vehicle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fix12 (inline patch)
        shell: bash
        run: |
          cat > vehicle/fix12.patch <<'PATCH_EOF'
          diff --git a/src/voxpilot/app/command_catalog.py b/src/voxpilot/app/command_catalog.py
          index 95a12d0..a3cc292 100644
          --- a/src/voxpilot/app/command_catalog.py
          +++ b/src/voxpilot/app/command_catalog.py
          @@ -16,6 +16,7 @@ CATALOG: Dict[str, List[Tuple[str, str]]] = {
                   ("Move cursor <direction> <n> pixels", "e.g. Move cursor right 5 pixels"),
                   ("Stop listening / Start listening", "Pause or resume Voice Control"),
                   ("Show commands", "List available commands"),
          +        ("Open Voice Control Tutorial", "Practise essential commands"),
               ],
               "Overlays": [
                   ("Show names / Hide names", "Label items with their names"),
          diff --git a/src/voxpilot/app/commands_window.py b/src/voxpilot/app/commands_window.py
          index 1971ac3..2d708b5 100644
          --- a/src/voxpilot/app/commands_window.py
          +++ b/src/voxpilot/app/commands_window.py
          @@ -25,7 +25,6 @@ class CommandsWindow(QtWidgets.QWidget):
                   self.setWindowTitle("Commands")
                   self.setWindowFlags(QtCore.Qt.Tool | QtCore.Qt.WindowStaysOnTopHint)
                   self.setAttribute(QtCore.Qt.WA_ShowWithoutActivating, True)
          -        self.resize(290, 390)
                   lay = QtWidgets.QVBoxLayout(self)
                   lay.setContentsMargins(0, 0, 0, 0)
                   self.tree = QtWidgets.QTreeWidget()
          @@ -63,6 +62,23 @@ class CommandsWindow(QtWidgets.QWidget):
                       top.addChild(child)
                   self.tree.expandItem(self.tree.topLevelItem(0))
                   self.tree.setTextElideMode(QtCore.Qt.ElideNone)
          +        self._fit_to_content()
          +
          +    def _fit_to_content(self) -> None:
          +        """Bounded palette: wide enough for the longest phrase, tall enough for the open rows."""
          +        fm = QtGui.QFontMetrics(self.tree.font())
          +        widest = 0
          +        for i in range(self.tree.topLevelItemCount()):
          +            top = self.tree.topLevelItem(i)
          +            widest = max(widest, fm.horizontalAdvance(top.text(0)) + 30)
          +            for j in range(top.childCount()):
          +                widest = max(widest, fm.horizontalAdvance(top.child(j).text(0)) + 40)
          +        row_h = max(fm.height() + 6, 18)
          +        visible_rows = 0
          +        for i in range(self.tree.topLevelItemCount()):
          +            top = self.tree.topLevelItem(i)
          +            visible_rows += 1 + (top.childCount() if top.isExpanded() else 0)
          +        self.resize(max(200, widest), min(520, row_h * visible_rows + 8))


           class Tutorial(QtWidgets.QDialog):
          @@ -93,3 +109,42 @@ class Tutorial(QtWidgets.QDialog):
                   if self.step < len(TUTORIAL_STEPS) and name == TUTORIAL_STEPS[self.step][1]:
                       self.step += 1
                       self._render()
          +
          +
          +class SettingsWindow(QtWidgets.QWidget):
          +    """Voice Control settings. The guide (mh40719) points to this page only for "Open Tutorial" and
          +    "Commands" (the full command list, including the characters Dictation/Spelling mode accept).
          +    Language and microphone live in the menu, as in the guide's menu screenshot."""
          +
          +    def __init__(self, engine, show_commands, parent=None) -> None:
          +        super().__init__(parent)
          +        self.setWindowTitle("Voice Control")
          +        self.engine = engine
          +        lay = QtWidgets.QVBoxLayout(self)
          +        lay.setContentsMargins(20, 16, 20, 16)
          +        lay.setSpacing(10)
          +        t = QtWidgets.QLabel("Voice Control")
          +        f = t.font()
          +        f.setPointSizeF(13.0)
          +        f.setBold(True)
          +        t.setFont(f)
          +        lay.addWidget(t)
          +        row = QtWidgets.QHBoxLayout()
          +        row.addWidget(QtWidgets.QLabel("Tutorial"))
          +        row.addStretch(1)
          +        b1 = QtWidgets.QPushButton("Open Tutorial...")
          +        b1.clicked.connect(lambda: self._open_tutorial())
          +        row.addWidget(b1)
          +        lay.addLayout(row)
          +        row2 = QtWidgets.QHBoxLayout()
          +        row2.addWidget(QtWidgets.QLabel("Commands"))
          +        row2.addStretch(1)
          +        b2 = QtWidgets.QPushButton("Commands...")
          +        b2.clicked.connect(lambda: show_commands())
          +        row2.addWidget(b2)
          +        lay.addLayout(row2)
          +        self.resize(380, 140)
          +
          +    def _open_tutorial(self) -> None:
          +        self._tutorial = Tutorial(self.engine, self)
          +        self._tutorial.show()
          diff --git a/src/voxpilot/app/tray.py b/src/voxpilot/app/tray.py
          index f49e0f4..17f8613 100644
          --- a/src/voxpilot/app/tray.py
          +++ b/src/voxpilot/app/tray.py
          @@ -294,11 +294,16 @@ class VoxPilotTrayIcon(QtWidgets.QSystemTrayIcon):
                   self.engine.overlay_service.update_hud(mode=self.engine.mode, text="Start listening")

               def _open_commands_window(self) -> None:
          -        from .commands_window import CommandsWindow
          -        shower = getattr(self.engine.overlay_service, "show_commands_window", None)
          -        if shower:
          -            from .command_catalog import commands_for_context
          -            shower(commands_for_context("general"))
          +        """Voice Control Settings...: the guide's settings page offers Open Tutorial and Commands."""
          +        from .commands_window import SettingsWindow
          +        from .command_catalog import CATALOG
          +
          +        def show_all_commands() -> None:
          +            rows = [(c, p, d) for c, items in CATALOG.items() for p, d in items]
          +            self.engine.overlay_service.show_commands_window(rows)
          +
          +        self._cmd_window = SettingsWindow(self.engine, show_all_commands)
          +        self._cmd_window.show()

               def _toggle_listening(self) -> None:
                   if self.engine.mode == EngineMode.SLEEP:
          diff --git a/src/voxpilot/commands/command_parser.py b/src/voxpilot/commands/command_parser.py
          index 0df99a9..1b16726 100644
          --- a/src/voxpilot/commands/command_parser.py
          +++ b/src/voxpilot/commands/command_parser.py
          @@ -36,6 +36,7 @@ class CommandParser:
                       {"intent": "HIDE_NAMES", "patterns": [r"^(?:please\s+)?hide\s+(?:item\s+)?names$", r"^names\s+off$"]},
                       {"intent": "SHOW_GRID", "patterns": [r"^(?:show|show me)?\s*(?:the\s+)?(?:screen\s+)?grid$", r"^grid\s+on$"]},
                       {"intent": "HIDE_GRID", "patterns": [r"^(?:please\s+)?hide\s+grid$", r"^grid\s+off$", r"^cancel\s+grid$"]},
          +            {"intent": "OPEN_TUTORIAL", "patterns": [r"^open\s+(the\s+)?voice\s+control\s+tutorial$"]},
                       {"intent": "SHOW_COMMANDS", "patterns": [r"^show\s+commands$", r"^what\s+can\s+i\s+say$"]},
                       {"intent": "WAKE_UP", "patterns": [r"^(?:voxpilot\s+)?wake\s+up(?:\s+voxpilot)?$", r"^start\s+listening$"]},
                       {"intent": "GO_TO_SLEEP", "patterns": [r"^(?:put\s+voxpilot\s+to\s+sleep|go\s+to\s+sleep|stop\s+listening|sleep)$"]},
          diff --git a/src/voxpilot/engine.py b/src/voxpilot/engine.py
          index bebaab9..0e3080f 100644
          --- a/src/voxpilot/engine.py
          +++ b/src/voxpilot/engine.py
          @@ -454,6 +454,11 @@ class VoxPilotEngine:
                       if show:
                           show(self.visible_commands)
                       return CommandResult.success(intent=intent, message="Displayed voice commands")
          +        elif name == "OPEN_TUTORIAL":
          +            opener = getattr(self.overlay_service, "show_tutorial", None)
          +            if opener:
          +                opener(self)
          +            return CommandResult.success(intent=intent, message="Opened Voice Control Tutorial")
                   elif name == "HIDE_COMMANDS":
                       hider = getattr(self.overlay_service, "hide_commands_window", None)
                       if hider:
          diff --git a/src/voxpilot/overlay/overlay_service.py b/src/voxpilot/overlay/overlay_service.py
          index 27aa69b..9dfa96b 100644
          --- a/src/voxpilot/overlay/overlay_service.py
          +++ b/src/voxpilot/overlay/overlay_service.py
          @@ -542,6 +542,11 @@ class OverlayService(IOverlayService):
                   self._commands_window = CommandsWindow(rows=list(rows))
                   self._commands_window.show()

          +    def show_tutorial(self, engine) -> None:
          +        from voxpilot.app.commands_window import Tutorial
          +        self._tutorial = Tutorial(engine)
          +        self._tutorial.show()
          +
               def hide_commands_window(self) -> None:
                   win = getattr(self, "_commands_window", None)
                   if win is not None:
          @@ -667,7 +672,7 @@ for _name in (
               "show_numbers", "show_names", "hide_names", "show_grid", "show_text_numbers",
               "hide_text_numbers", "show_disambiguation", "show_hud", "hide", "hide_numbers",
               "hide_grid", "hide_all", "update_hud", "drill_down_grid", "undo_grid",
          -    "show_commands_window", "hide_commands_window",
          +    "show_commands_window", "hide_commands_window", "show_tutorial",
           ):
               if hasattr(OverlayService, _name):
                   setattr(OverlayService, _name, _marshal(getattr(OverlayService, _name)))
          diff --git a/tests/test_voice_control_parity.py b/tests/test_voice_control_parity.py
          index 2cda1c4..2403b6b 100644
          --- a/tests/test_voice_control_parity.py
          +++ b/tests/test_voice_control_parity.py
          @@ -315,3 +315,10 @@ def test_show_commands_opens_real_palette_and_hide_closes_it() -> None:
               ov.hide_commands_window()
               QtWidgets.QApplication.instance().processEvents()
               assert not win.isVisible()
          +
          +
          +def test_open_voice_control_tutorial_command() -> None:
          +    from voxpilot.commands.command_parser import CommandParser
          +    intent = CommandParser().parse("open voice control tutorial")
          +    assert intent.name == "OPEN_TUTORIAL"
          +    assert CommandParser().parse("open mail").name != "OPEN_TUTORIAL"
          PATCH_EOF
          git apply --whitespace=nowarn vehicle/fix12.patch
      - name: Setup and test
        shell: cmd
        run: setup_windows.bat
      - name: Tests
        shell: cmd
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q tests --tb=short
      - name: Commit and push source branch (only if tests passed)
        shell: pwsh
        run: |
          git config user.name "voxpilot-parity-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A -- . ':!vehicle' ':!.venv' ':!models'
          git commit -m "Settings window per guide; fitted Commands palette; tutorial command"
          git push origin voxpilot-voice-control-parity
