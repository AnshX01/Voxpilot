          +            path.moveTo(10, 14)
          +            path.cubicTo(18, 24, 26, 28, 33, 30)
          +            path.cubicTo(27, 31, 20, 29, 15, 26)
          +            path.cubicTo(20, 31, 27, 34, 36, 33)
          +            path.cubicTo(38, 31, 38, 26, 34, 21)
          +            path.cubicTo(36, 17, 36, 13, 34, 10)
          +            path.cubicTo(30, 17, 24, 19, 18, 17)
          +            path.cubicTo(15, 16, 12, 15, 10, 14)
          +            p.setPen(QtCore.Qt.NoPen)
          +            p.setBrush(fg)
          +            p.drawPath(path)
                   else:
          -            f = QtGui.QFont("Segoe UI", 17, QtGui.QFont.Bold)
          +            f = QtGui.QFont("Segoe UI", 17, QtGui.QFont.Normal)
                       p.setFont(f)
          -            p.drawText(QtCore.QRect(0, 0, 44, 44), QtCore.Qt.AlignCenter, "A" if kind == "a" else "S")
          +            p.drawText(QtCore.QRect(0, 0, 44, 44), QtCore.Qt.AlignCenter, "A")
                   p.end()
                   return QtGui.QIcon(px)

          @@ -375,7 +389,14 @@ def main() -> int:
                       3000,
                   )

          -    return app.exec()
          +    overlay = getattr(engine, "overlay_service", None)
          +    if overlay is not None:
          +        overlay.gui_loop_running = True
          +    try:
          +        return app.exec()
          +    finally:
          +        if overlay is not None:
          +            overlay.gui_loop_running = False


           if __name__ == "__main__":
          diff --git a/src/voxpilot/engine.py b/src/voxpilot/engine.py
          index 3cd7bdf..150871c 100644
          --- a/src/voxpilot/engine.py
          +++ b/src/voxpilot/engine.py
          @@ -109,10 +109,20 @@ class VoxPilotEngine:
                           ev = self._dispatch_q.get()
                           if ev is None:
                               return
          +                if not self.is_running:
          +                    continue  # stopped while this utterance was queued
                           try:
                               self._handle_final_event(ev)
                           except Exception:  # pragma: no cover
                               logger.exception("transcript handling failed")
          +                if not self.is_running:
          +                    # stop() arrived while this command was in flight: undo its lingering
          +                    # on-screen / key-state effects (an already injected click or key cannot be recalled)
          +                    try:
          +                        self.overlay_service.hide_all()
          +                        self.input_injector.release_all_modifiers()
          +                    except Exception:  # pragma: no cover
          +                        logger.exception("post-stop cleanup failed")

                   self._dispatch_thread = threading.Thread(target=work, daemon=True, name="voxpilot-dispatch")
                   self._dispatch_thread.start()
          diff --git a/src/voxpilot/overlay/overlay_service.py b/src/voxpilot/overlay/overlay_service.py
          index b8c2a4e..b58d197 100644
          --- a/src/voxpilot/overlay/overlay_service.py
          +++ b/src/voxpilot/overlay/overlay_service.py
          @@ -599,19 +599,26 @@ class _GuiInvoker(QtCore.QObject):


           def _marshal(fn):
          +    """Run `fn` on the GUI thread. Off-thread callers are queued to it only while the app's
          +    event loop is running (`gui_loop_running`). A queued job that has not started after the
          +    timeout is cancelled (never run later, never run on the calling thread); the call then
          +    returns None and logs. With no event loop (headless/tests) calls run in the caller's thread
          +    exactly as before, since there is no GUI thread to hand off to."""
               import functools

               @functools.wraps(fn)
               def wrapper(self, *args, **kwargs):
                   invoker = getattr(self, "_invoker", None)
          -        if invoker is None or threading.get_ident() == self._gui_ident:
          +        if (invoker is None or threading.get_ident() == self._gui_ident
          +                or not getattr(self, "gui_loop_running", False)):
                       return fn(self, *args, **kwargs)
          -        state = {"claimed": False, "done": threading.Event(), "result": None, "error": None}
          +        state = {"claimed": False, "cancelled": False, "done": threading.Event(),
          +                 "result": None, "error": None}
                   lock = threading.Lock()

                   def job():
                       with lock:
          -                if state["claimed"]:
          +                if state["claimed"] or state["cancelled"]:
                               return
                           state["claimed"] = True
                       try:
          @@ -622,13 +629,13 @@ def _marshal(fn):
                           state["done"].set()

                   invoker.call.emit(job)
          -        if not state["done"].wait(1.0):
          +        if not state["done"].wait(3.0):
                       with lock:
                           if not state["claimed"]:
          -                    # no GUI event loop is running (headless/tests): run inline as before
          -                    state["claimed"] = True
          -                    return fn(self, *args, **kwargs)
          -            state["done"].wait(5.0)
          +                    state["cancelled"] = True
          +                    logger.error("GUI thread did not service overlay call %s; dropped", fn.__name__)
          +                    return None
          +            state["done"].wait(10.0)  # already running on the GUI thread; wait for it
                   if state["error"] is not None:
                       raise state["error"]
                   return state["result"]
          diff --git a/tests/test_targets_e2e.py b/tests/test_targets_e2e.py
          index c22045f..d893900 100644
          --- a/tests/test_targets_e2e.py
          +++ b/tests/test_targets_e2e.py
          @@ -51,7 +51,14 @@ def test_explorer_voice_control_e2e():
               engine.start()

               try:
          -        elements = engine.element_provider.discover_elements()
          +        # The Explorer window opens asynchronously (slow on CI runners): poll instead of one fixed sleep.
          +        elements = []
          +        deadline = time.time() + 25
          +        while time.time() < deadline:
          +            elements = engine.element_provider.discover_elements()
          +            if elements:
          +                break
          +            time.sleep(1.0)
                   assert len(elements) > 0
                   print(f"\n[Explorer E2E] Discovered {len(elements)} elements in Explorer")

          diff --git a/tests/test_voice_control_parity.py b/tests/test_voice_control_parity.py
          index 3f9ced4..7bbc96a 100644
          --- a/tests/test_voice_control_parity.py
          +++ b/tests/test_voice_control_parity.py
          @@ -209,6 +209,7 @@ def test_overlay_calls_from_worker_thread_run_on_gui_thread() -> None:
               from PySide6 import QtCore, QtWidgets
               from voxpilot.overlay.overlay_service import OverlayService
               ov = OverlayService()
          +    ov.gui_loop_running = True
               gui = threading.get_ident()
               ran = []
               orig = ov._canvas.hide
          @@ -223,3 +224,54 @@ def test_overlay_calls_from_worker_thread_run_on_gui_thread() -> None:
                   time.sleep(0.01)
               t.join()
               assert ran == [gui]
          +
          +
          +def test_stalled_gui_thread_never_runs_call_inline_or_late() -> None:
          +    """Loop flagged running but not serviced: the call is dropped, not run on the worker thread,
          +    and does not run later when the GUI thread finally processes events."""
          +    import threading
          +    from PySide6 import QtWidgets
          +    from voxpilot.overlay import overlay_service as osv
          +    ov = osv.OverlayService()
          +    ov.gui_loop_running = True
          +    ran = []
          +    orig = ov._canvas.hide
          +    ov._canvas.hide = lambda: (ran.append(threading.get_ident()), orig())[1]
          +    t = threading.Thread(target=ov.hide_all)
          +    t.start()
          +    t.join(8)  # GUI thread (this one) never services the queue during the wait
          +    assert not t.is_alive()
          +    assert ran == []                      # not executed inline on the worker
          +    QtWidgets.QApplication.instance().processEvents()
          +    assert ran == []                      # and not executed late (cancelled)
          +
          +
          +def test_stop_drops_queued_and_cleans_after_inflight(engine) -> None:
          +    import threading, time
          +    from voxpilot.contracts.dto import TranscriptEvent
          +    e, _, _ = engine
          +    e.is_running = True
          +    started, release, handled = threading.Event(), threading.Event(), []
          +    cleaned = []
          +
          +    def handler(ev):
          +        started.set()
          +        release.wait(3)
          +        handled.append(ev.text)
          +
          +    e._handle_final_event = handler
          +    e.overlay_service = type("O", (), {"hide_all": lambda s: cleaned.append("hide"),
          +                                       "stop_refresh": lambda s: None})()
          +    e.input_injector.release_all_modifiers = lambda: cleaned.append("mods")
          +    e._start_dispatch_worker()
          +    e._on_transcript(TranscriptEvent(text="one", is_final=True))
          +    started.wait(2)
          +    e._on_transcript(TranscriptEvent(text="two", is_final=True))  # queued behind the in-flight one
          +    e.stop()
          +    release.set()
          +    for _ in range(60):
          +        if "hide" in cleaned[2:] or cleaned.count("hide") >= 2:
          +            break
          +        time.sleep(0.05)
          +    assert handled == ["one"]             # queued utterance never ran after stop
          +    assert cleaned.count("hide") >= 2     # stop() cleanup plus post-in-flight cleanup
          PATCH_EOF
          git apply --whitespace=nowarn vehicle/fix9.patch
      - name: Setup and test
        shell: cmd
        run: setup_windows.bat
      - name: Tests
        shell: cmd
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q tests --tb=short
      - name: Commit and push source branch (only if tests passed)
        shell: pwsh
        run: |
          git config user.name "voxpilot-parity-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A -- . ':!vehicle' ':!.venv' ':!models'
          git commit -m "Safe GUI marshalling, post-stop cleanup, menu polish"
          git push origin voxpilot-voice-control-parity
