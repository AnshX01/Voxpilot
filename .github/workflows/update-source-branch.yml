                   wa.setDefaultWidget(label)
          @@ -138,10 +138,24 @@ class VoxPilotTrayIcon(QtWidgets.QSystemTrayIcon):
                           ex, ey = 22 + dx * 12, 22 + dy * 12
                           p.drawLine(ex, ey, ex - dx * 4 + dy * 4, ey - dy * 4 + dx * 4)
                           p.drawLine(ex, ey, ex - dx * 4 - dy * 4, ey - dy * 4 - dx * 4)
          +        elif kind == "s":
