# run 10
name: update-source-branch
on:
  push:
    branches: [voxpilot-parity-windows-test]
    paths: [".github/workflows/update-source-branch.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-voice-control-parity
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-parity-windows-test
          path: vehicle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fix10 (inline patch)
        shell: bash
        run: |
          cat > vehicle/fix10.patch <<'PATCH_EOF'
          diff --git a/src/voxpilot/app/cli.py b/src/voxpilot/app/cli.py
          index c70e721..177f1ab 100644
          --- a/src/voxpilot/app/cli.py
          +++ b/src/voxpilot/app/cli.py
          @@ -150,6 +150,49 @@ def run_calibrate() -> int:
               return 0


          +def run_mic_test(seconds: int, device, report_path: str = "voxpilot-mic-test.txt") -> int:
          +    """Record from the real microphone and show what the recognizer hears (writes voxpilot-mic-test.txt)."""
          +    import time
          +    import numpy as np
          +    from ..contracts.dto import TranscriptEvent
          +    from ..speech.audio_capture import LiveAudioCapture
          +    from ..speech.vosk_engine import VoskSpeechEngine
          +
          +    lines = []
          +
          +    def say(msg: str) -> None:
          +        print(msg)
          +        lines.append(msg)
          +
          +    engine = VoskSpeechEngine()
          +    engine.set_open_vocabulary(True)
          +    engine.subscribe(lambda ev: say(("FINAL   : " if ev.is_final else "partial : ") + ev.text) if ev.text else None)
          +    engine.start()
          +    cap = LiveAudioCapture()
          +    cap.start(device_id=device)
          +    say(f"Input device index: {cap.device_id}, native rate: {cap.native_samplerate}, channels: {cap.native_channels}")
          +    say(f"Speak normally for {seconds} seconds...")
          +    t_end, peak, sq, n, dropped0 = time.time() + seconds, 0.0, 0.0, 0, 0
          +    while time.time() < t_end:
          +        chunk = cap.read_chunk(timeout=0.2)
          +        if not chunk:
          +            continue
          +        a = np.frombuffer(chunk.data, dtype=np.int16).astype(np.float32) / 32768.0
          +        if a.size:
          +            peak = max(peak, float(np.abs(a).max()))
          +            sq += float((a * a).sum())
          +            n += a.size
          +        engine.process_audio(chunk)
          +    engine.flush()
          +    cap.stop()
          +    rms = (sq / n) ** 0.5 if n else 0.0
          +    say(f"Peak level: {peak:.3f}  RMS: {rms:.4f}  (peak below 0.02 = mic too quiet or wrong device)")
          +    with open(report_path, "w", encoding="utf-8") as fh:
          +        fh.write("\n".join(lines) + "\n")
          +    print(f"Saved {report_path}")
          +    return 0
          +
          +
           def main() -> int:
               parser = argparse.ArgumentParser(description="VoxPilot Voice Control CLI")
               subparsers = parser.add_subparsers(dest="command")
          @@ -160,6 +203,10 @@ def main() -> int:
               subparsers.add_parser("calibrate", help="Run acoustic calibration wizard")
               subparsers.add_parser("run", help="Launch VoxPilot system tray application")

          +    mic_parser = subparsers.add_parser("mic-test", help="Record from the microphone and show what is recognized")
          +    mic_parser.add_argument("--seconds", type=int, default=10)
          +    mic_parser.add_argument("--device", type=int, default=None)
          +
               say_parser = subparsers.add_parser("say", help="Simulate a spoken voice command")
               say_parser.add_argument("phrase", type=str, help="Utterance to simulate")

          @@ -167,6 +214,8 @@ def main() -> int:

               if args.command == "doctor":
                   return run_doctor()
          +    elif args.command == "mic-test":
          +        return run_mic_test(args.seconds, args.device)
               elif args.command == "say":
                   return run_say(args.phrase)
               elif args.command == "list-commands":
          diff --git a/src/voxpilot/app/tray.py b/src/voxpilot/app/tray.py
          index 4e31b48..b7fe2d5 100644
          --- a/src/voxpilot/app/tray.py
          +++ b/src/voxpilot/app/tray.py
          @@ -73,9 +73,9 @@ class VoxPilotTrayIcon(QtWidgets.QSystemTrayIcon):
               )

               _MENU_QSS = """
          -    QMenu { background: rgba(244,240,236,245); border: 1px solid rgba(0,0,0,40); border-radius: 12px;
          -            padding: 8px 6px; icon-size: 26px; font-family: 'Segoe UI'; font-size: 10.5pt; color: #1d1d1f; }
          -    QMenu::item { padding: 6px 26px 6px 10px; border-radius: 6px; margin: 1px 4px; }
          +    QMenu { background: qlineargradient(x1:0,y1:0,x2:1,y2:1, stop:0 rgba(247,243,238,247), stop:1 rgba(226,219,212,247)); border: 1px solid rgba(0,0,0,40); border-radius: 12px;
          +            padding: 8px 6px; icon-size: 30px; font-family: 'Segoe UI'; font-size: 10.5pt; color: #1d1d1f; }
          +    QMenu::item { padding: 3px 26px 3px 8px; border-radius: 6px; margin: 1px 6px; }
               QMenu::item:selected { background: rgba(10,132,255,255); color: white; }
               QMenu::item:disabled { color: #8e8a86; }
               QMenu::separator { height: 1px; background: rgba(0,0,0,30); margin: 6px 14px; }
          @@ -86,7 +86,7 @@ class VoxPilotTrayIcon(QtWidgets.QSystemTrayIcon):
               def _add_header(menu, text: str, title: bool = False):
                   label = QtWidgets.QLabel(text)
                   label.setStyleSheet(
          -            "padding: 6px 14px 3px 14px; background: transparent; font-size: 10.5pt; "
          +            "padding: 4px 14px 2px 14px; background: transparent; font-size: 10.5pt; "
                       + ("font-weight: 700; font-size: 11pt; color: #1d1d1f;" if title else "font-weight: 600; color: #8a8681;")
                   )
                   wa = QtWidgets.QWidgetAction(menu)
          diff --git a/tests/test_voice_control_parity.py b/tests/test_voice_control_parity.py
          index 7bbc96a..b87aac3 100644
          --- a/tests/test_voice_control_parity.py
          +++ b/tests/test_voice_control_parity.py
          @@ -275,3 +275,28 @@ def test_stop_drops_queued_and_cleans_after_inflight(engine) -> None:
                   time.sleep(0.05)
               assert handled == ["one"]             # queued utterance never ran after stop
               assert cleaned.count("hide") >= 2     # stop() cleanup plus post-in-flight cleanup
          +
          +
          +def test_mic_test_command_reports_levels(tmp_path, monkeypatch, capsys) -> None:
          +    """`mic-test` runs end to end against a fake capture device and writes its report."""
          +    import numpy as np
          +    from voxpilot.app import cli
          +    from voxpilot.contracts.dto import AudioChunk
          +    import voxpilot.speech.audio_capture as ac
          +
          +    class FakeCap:
          +        device_id, native_samplerate, native_channels = 3, 48000, 1
          +        def __init__(self): self.n = 0
          +        def start(self, device_id=None): pass
          +        def stop(self): pass
          +        def read_chunk(self, timeout=0.2):
          +            self.n += 1
          +            t = np.arange(800) / 16000.0
          +            pcm = (0.3 * np.sin(2 * np.pi * 440 * t) * 32767).astype(np.int16)
          +            return AudioChunk(data=pcm.tobytes())
          +
          +    monkeypatch.setattr(ac, "LiveAudioCapture", FakeCap)
          +    assert cli.run_mic_test(1, None, str(tmp_path / "voxpilot-mic-test.txt")) == 0
          +    out = capsys.readouterr().out
          +    assert "Peak level: 0.3" in out
          +    assert (tmp_path / "voxpilot-mic-test.txt").exists()
          PATCH_EOF
          git apply --whitespace=nowarn vehicle/fix10.patch
      - name: Setup and test
        shell: cmd
        run: setup_windows.bat
      - name: Tests
        shell: cmd
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q tests --tb=short
      - name: Commit and push source branch (only if tests passed)
        shell: pwsh
        run: |
          git config user.name "voxpilot-parity-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A -- . ':!vehicle' ':!.venv' ':!models'
          git commit -m "mic-test command, menu proportions"
          git push origin voxpilot-voice-control-parity
