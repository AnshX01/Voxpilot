          @@ -86,8 +86,8 @@ class VoxPilotTrayIcon(QtWidgets.QSystemTrayIcon):
               def _add_header(menu, text: str, title: bool = False):
                   label = QtWidgets.QLabel(text)
                   label.setStyleSheet(
          -            "padding: 4px 14px 2px 14px; background: transparent; "
