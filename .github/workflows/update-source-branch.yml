# run 9
name: update-source-branch
on:
  push:
    branches: [voxpilot-parity-windows-test]
    paths: [".github/workflows/update-source-branch.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-voice-control-parity
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-parity-windows-test
          path: vehicle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fix9 (inline patch)
        shell: bash
        run: |
          cat > vehicle/fix9.patch <<'PATCH_EOF'
          diff --git a/src/voxpilot/app/tray.py b/src/voxpilot/app/tray.py
          index 226f484..4e31b48 100644
