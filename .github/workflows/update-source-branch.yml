# run 16
name: update-source-branch
on:
  push:
    branches: [voxpilot-parity-windows-test]
    paths: [".github/workflows/update-source-branch.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-voice-control-parity
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-parity-windows-test
          path: vehicle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fix16 (inline patch)
        shell: bash
        run: |
          cat > vehicle/fix16.patch <<'PATCH_EOF'
          diff --git a/src/voxpilot/app/tray.py b/src/voxpilot/app/tray.py
          index 76c61eb..b750277 100644
          --- a/src/voxpilot/app/tray.py
          +++ b/src/voxpilot/app/tray.py
          @@ -353,7 +353,13 @@ class VoxPilotTrayIcon(QtWidgets.QSystemTrayIcon):
                               self._select_microphone(idx)
                               return
           
          +        def current_mic():
          +            if self._selected_mic is None:
          +                return "Automatic"
          +            return dict(self.list_input_devices()).get(self._selected_mic)
          +
                   hooks = {
          +            "current_mic": current_mic,
                       "list_mics": self.list_input_devices,
                       "select_mic": select_mic,
                       "set_listening": lambda on: self._start_listening() if on else self._stop_listening(),
          diff --git a/src/voxpilot/app/voice_settings.py b/src/voxpilot/app/voice_settings.py
          index ef0dc44..1f8f73d 100644
          --- a/src/voxpilot/app/voice_settings.py
          +++ b/src/voxpilot/app/voice_settings.py
          @@ -286,6 +286,18 @@ class VoiceControlSettingsWindow(QtWidgets.QWidget):
                   self.enabled.blockSignals(True)
                   self.enabled.setChecked(self.engine.mode.value != "sleep")
                   self.enabled.blockSignals(False)
          +        current = (self.hooks.get("current_mic") or (lambda: None))()
          +        if current:
          +            i = self.mic.findText(current)
          +            if i >= 0:
          +                self.mic.blockSignals(True)
          +                self.mic.setCurrentIndex(i)
          +                self.mic.blockSignals(False)
          +                self.settings.microphone = current  # keep the saved choice equal to what the tray is using
          +                try:
          +                    self.settings.save()
          +                except OSError:
          +                    pass
                   super().showEvent(ev)
           
               # -- actions -------------------------------------------------------------------------------
          diff --git a/tests/test_voice_control_parity.py b/tests/test_voice_control_parity.py
          index 2ceb7b8..d8b61fe 100644
          --- a/tests/test_voice_control_parity.py
          +++ b/tests/test_voice_control_parity.py
          @@ -507,3 +507,31 @@ def test_fade_is_off_by_default_and_dims_only_when_enabled() -> None:
               assert abs(ov._canvas.windowOpacity() - 0.5) < 0.05
               ov.touch()
               assert ov._canvas.windowOpacity() == 1.0
          +
          +
          +def test_settings_toggle_and_mic_call_hooks_and_resync(engine, tmp_path, monkeypatch) -> None:
          +    from PySide6 import QtWidgets
          +    QtWidgets.QApplication.instance() or QtWidgets.QApplication([])
          +    monkeypatch.setenv("VOXPILOT_SETTINGS_DIR", str(tmp_path))
          +    from voxpilot.app.voice_settings import VoiceControlSettingsWindow
          +    e, _, _ = engine
          +    calls, state = [], {"mic": "Automatic"}
          +    hooks = {
          +        "list_mics": lambda: [(1, "Laptop Microphone"), (3, "Headset")],
          +        "set_listening": lambda on: calls.append(("listen", on)),
          +        "select_mic": lambda name: calls.append(("mic", name)),
          +        "current_mic": lambda: state["mic"],
          +    }
          +    w = VoiceControlSettingsWindow(e, hooks)
          +    w.enabled.setChecked(False)
          +    w.enabled.setChecked(True)
          +    assert calls == [("listen", False), ("listen", True)]
          +    w.mic.setCurrentText("Headset")
          +    assert ("mic", "Headset") in calls and e.settings.microphone == "Headset"
          +    state["mic"] = "Laptop Microphone"  # tray changed the mic while the window was closed
          +    w.show()
          +    assert w.mic.currentText() == "Laptop Microphone"
          +    assert e.settings.microphone == "Laptop Microphone"  # saved choice follows the tray; no capture restart
          +    n = len(calls)
          +    w.hide(); w.show()
          +    assert len(calls) == n
          PATCH_EOF
          git apply --whitespace=nowarn vehicle/fix16.patch
      - name: Setup and test
        shell: cmd
        run: setup_windows.bat
      - name: Tests
        shell: cmd
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q tests --tb=short
      - name: Commit and push source branch (only if tests passed)
        shell: pwsh
        run: |
          git config user.name "voxpilot-parity-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A -- . ':!vehicle' ':!.venv' ':!models'
          git commit -m "Settings: mic live-sync, hook tests"
          git push origin voxpilot-voice-control-parity
