# run 11
name: update-source-branch
on:
  push:
    branches: [voxpilot-parity-windows-test]
    paths: [".github/workflows/update-source-branch.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-voice-control-parity
      - uses: actions/checkout@v4
        with:
          ref: voxpilot-parity-windows-test
          path: vehicle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fix11 (inline patch)
        shell: bash
        run: |
          cat > vehicle/fix11.patch <<'PATCH_EOF'
          diff --git a/src/voxpilot/app/command_catalog.py b/src/voxpilot/app/command_catalog.py
          index 4abc816..95a12d0 100644
          --- a/src/voxpilot/app/command_catalog.py
          +++ b/src/voxpilot/app/command_catalog.py
          @@ -9,7 +9,7 @@ from __future__ import annotations
           from typing import Dict, List, Tuple

           CATALOG: Dict[str, List[Tuple[str, str]]] = {
          -    "Basic navigation": [
          +    "Basic Navigation": [
                   ("Open <app name>", "Open an app, e.g. Open Mail"),
                   ("Scroll up / Scroll down", "Scroll the active window"),
                   ("Click <item name or number>", "Click an item, e.g. Click Done"),
          @@ -43,5 +43,5 @@ CATALOG: Dict[str, List[Tuple[str, str]]] = {

           def commands_for_context(ctx: str) -> List[Tuple[str, str, str]]:
               """Return (category, phrase, description) rows; text-editing first when typing."""
          -    order = ["Text editing", "Modes", "Overlays", "Basic navigation"] if ctx == "text" else list(CATALOG)
          +    order = ["Text editing", "Modes", "Overlays", "Basic Navigation"] if ctx == "text" else list(CATALOG)
               return [(cat, phrase, desc) for cat in order for phrase, desc in CATALOG[cat]]
          diff --git a/src/voxpilot/app/commands_window.py b/src/voxpilot/app/commands_window.py
          index 5bc9b83..1971ac3 100644
          --- a/src/voxpilot/app/commands_window.py
          +++ b/src/voxpilot/app/commands_window.py
          @@ -1,7 +1,7 @@
           """Voice Control Commands window and interactive tutorial (Qt)."""
           from __future__ import annotations

          -from PySide6 import QtCore, QtWidgets
          +from PySide6 import QtCore, QtGui, QtWidgets

           from .command_catalog import commands_for_context

          @@ -16,32 +16,53 @@ TUTORIAL_STEPS = [


           class CommandsWindow(QtWidgets.QWidget):
