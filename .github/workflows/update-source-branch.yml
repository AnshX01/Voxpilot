          +        w = max(24, fm.horizontalAdvance(text) + 12)
          +        h = 20
                   pix = QtGui.QPixmap(w + 6, h + 6)
                   pix.fill(QtCore.Qt.transparent)
                   p = QtGui.QPainter(pix)
          @@ -232,9 +232,6 @@ class OverlayCanvas(QtWidgets.QWidget):
                   if self.mode == OverlayMode.GRID and self.grid_model is not None:
                       gm = self.grid_model
                       b = gm.bounds
          -            painter.setBrush(QtGui.QColor(0, 0, 0, 18))
          -            painter.setPen(QtCore.Qt.NoPen)
          -            painter.drawRect(b.x, b.y, b.w, b.h)
                       painter.setPen(QtGui.QPen(QtGui.QColor(40, 36, 32, 190), 1.0))
                       for c in range(gm.cols + 1):
                           x = b.x + round(c * b.w / gm.cols)
          @@ -538,6 +535,19 @@ class OverlayService(IOverlayService):
                       except Exception:
                           pass

          +    def show_commands_window(self, rows) -> None:
          +        """Show the floating Commands palette (voice command "Show commands")."""
          +        from voxpilot.app.commands_window import CommandsWindow
          +        self.hide_commands_window()
          +        self._commands_window = CommandsWindow(rows=list(rows))
          +        self._commands_window.show()
          +
          +    def hide_commands_window(self) -> None:
          +        win = getattr(self, "_commands_window", None)
          +        if win is not None:
          +            win.close()
          +            self._commands_window = None
          +
               def hide_numbers(self) -> None:
                   self._is_continuous_numbers = False
                   if self._current_mode in (OverlayMode.NUMBERS, OverlayMode.CONTINUOUS_NUMBERS):
          @@ -657,6 +667,7 @@ for _name in (
               "show_numbers", "show_names", "hide_names", "show_grid", "show_text_numbers",
               "hide_text_numbers", "show_disambiguation", "show_hud", "hide", "hide_numbers",
               "hide_grid", "hide_all", "update_hud", "drill_down_grid", "undo_grid",
          +    "show_commands_window", "hide_commands_window",
           ):
               if hasattr(OverlayService, _name):
                   setattr(OverlayService, _name, _marshal(getattr(OverlayService, _name)))
          diff --git a/tests/test_voice_control_parity.py b/tests/test_voice_control_parity.py
          index b87aac3..2cda1c4 100644
          --- a/tests/test_voice_control_parity.py
          +++ b/tests/test_voice_control_parity.py
          @@ -105,7 +105,7 @@ def test_show_commands_context_lists_text_commands_first(engine):
               assert e.visible_commands[0][0] == "Text editing"
               say(e, "command mode")
               say(e, "show commands")
          -    assert e.visible_commands[0][0] == "Basic navigation"
          +    assert e.visible_commands[0][0] == "Basic Navigation"


           def test_recognizer_is_open_vocabulary_in_every_mode(engine):
          @@ -300,3 +300,18 @@ def test_mic_test_command_reports_levels(tmp_path, monkeypatch, capsys) -> None:
               out = capsys.readouterr().out
               assert "Peak level: 0.3" in out
               assert (tmp_path / "voxpilot-mic-test.txt").exists()
          +
          +
          +def test_show_commands_opens_real_palette_and_hide_closes_it() -> None:
          +    from PySide6 import QtWidgets
          +    from voxpilot.overlay.overlay_service import OverlayService
          +    from voxpilot.app.command_catalog import commands_for_context
          +    ov = OverlayService()
          +    ov.show_commands_window(commands_for_context("general"))
          +    win = ov._commands_window
          +    assert win.isVisible() and win.windowTitle() == "Commands"
          +    assert win.tree.topLevelItem(0).text(0) == "Basic Navigation"
          +    assert win.tree.topLevelItem(0).child(0).text(0).startswith("Open")
          +    ov.hide_commands_window()
          +    QtWidgets.QApplication.instance().processEvents()
          +    assert not win.isVisible()
          PATCH_EOF
          git apply --whitespace=nowarn vehicle/fix11.patch
      - name: Setup and test
        shell: cmd
        run: setup_windows.bat
      - name: Tests
        shell: cmd
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: .venv\Scripts\python -m pytest -q tests --tb=short
      - name: Commit and push source branch (only if tests passed)
        shell: pwsh
        run: |
          git config user.name "voxpilot-parity-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A -- . ':!vehicle' ':!.venv' ':!models'
          git commit -m "Commands palette like the guide; grid badges"
          git push origin voxpilot-voice-control-parity
